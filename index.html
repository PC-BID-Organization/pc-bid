<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="PCBid - Sàn đấu giá trực tuyến chuyên biệt cho linh kiện máy tính đã qua sử dụng. Đồ án IE104 UIT.">
  <title>PCBid - Sàn Đấu Giá Linh Kiện PC Cũ</title>

  <!-- Phông chữ Google Fonts: Be Vietnam Pro & Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet">

  <!-- Tệp tin định kiểu cốt lõi & biến toàn cục -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">

  <!-- Tệp tin định kiểu riêng cho từng thành phần (Components) -->
  <link rel="stylesheet" href="components/header/header.css">
  <link rel="stylesheet" href="components/footer/footer.css">
</head>

<body id="home-page">

  <!-- ==================== KHUNG CHỨA HEADER NẠP ĐỘNG ==================== -->
  <div id="app-header"></div>

  <!-- ==================== KHU VỰC NỘI DUNG CHÍNH (MAIN CONTENT PLACEHOLDER) ==================== -->
  <main style="min-height: 400px; padding: 60px 0;">
    <div class="container"
      style="display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed rgba(226, 191, 178, 0.8); border-radius: 8px; background-color: rgba(239, 244, 255, 0.5); padding: 80px 24px; text-align: center;">
      <div
        style="width: 48px; height: 48px; border-radius: 12px; background-color: #E5EEFF; display: flex; align-items: center; justify-content: center; margin-bottom: 16px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A33900" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="9" y1="21" x2="9" y2="9"></line>
        </svg>
      </div>
      <h2
        style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; color: #0B1C30; margin-bottom: 8px;">
        Vùng Nội Dung Chính (Main Page Content Area)</h2>
      <p style="font-size: 14px; line-height: 22px; color: #565E74; max-width: 580px; margin-bottom: 16px;">Khu vực hiển
        thị nội dung động của từng màn hình chức năng.<br>Shell Header & Footer 4 cột đồng bộ toàn hệ sinh thái PCBid
        qua bộ nạp component động.</p>
      <div style="display: flex; gap: 8px;">
        <span
          style="display: inline-block; padding: 4px 12px; background-color: #FFFFFF; border: 1px solid rgba(226, 191, 178, 0.5); border-radius: 12px; font-size: 11px; font-weight: 600; color: #565E74;">Đồ
          án IE104 - UIT</span>
        <span
          style="display: inline-block; padding: 4px 12px; background-color: #FFFFFF; border: 1px solid rgba(226, 191, 178, 0.5); border-radius: 12px; font-size: 11px; font-weight: 600; color: #565E74;">Shell
          Type: Standard</span>
      </div>
    </div>
  </main>

  <!-- ==================== KHUNG CHỨA FOOTER NẠP ĐỘNG ==================== -->
  <div id="app-footer"></div>

  <!-- Mã JavaScript ứng dụng chính (Module ES6) -->
  <script type="module" src="js/main.js"></script>
</body>

</html>
